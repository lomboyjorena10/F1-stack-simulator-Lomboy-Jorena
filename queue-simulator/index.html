<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Queue Data Structure Simulator</title>
    <!-- Opisyal na CDN links mula sa framework ng iyong klase -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <script src="https://jquery.com"></script>
    <style>
        .enqueue { font-weight: bold; }
        .dequeue { font-weight: bold; }
        .pick { background-color: gold !important; color: black !important; }
        .indicator { font-size: 0.75rem; display: block; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid p-4">
        <h2 class="text-center mb-4">Queue Data Structure Simulator</h2>
        
        <!-- Controls interface -->
        <div class="row justify-content-center mb-4">
            <div class="col-sm-6 text-center">
                <div class="mb-3">
                    <label class="form-label font-size-4">Enter value</label>
                    <input type="text" id="QU_data" class="form-control text-center">
                </div>
                <div class="d-flex gap-1 justify-content-center">
                    <button id="btn_enqueue" class="btn btn-success">Enqueue</button>
                    <button id="btn_dequeue" class="btn btn-danger">Dequeue</button>
                    <button id="btn_pick" class="btn btn-warning">Pick (Front)</button>
                    <button id="btn_clear" class="btn btn-light border">Clear</button>
                </div>
            </div>
        </div>

        <!-- Structural Data View Blocks -->
        <div class="row justify-content-center mx-2">
            <div class="col-sm-5 border bg-white p-3 rounded me-2">
                <h5 class="text-center text-primary">Queue Data</h5>
                <p class="text-center text-muted small">Left = FRONT (Alis) | Right = REAR (Pasok)</p>
                <hr>
                <div id="queue" class="d-flex flex-row flex-wrap gap-2 justify-content-center"></div>
            </div>
            <div class="col-sm-4 border bg-white p-3 rounded">
                <h5 class="text-center text-danger">Deleted from Queue</h5>
                <hr>
                <div id="dequeue" class="d-flex flex-column gap-1"></div>
            </div>
        </div>
    </div>

    <script>
        // First In, First Out (FIFO) Blueprint Class Structure
        class Queue {
            constructor() {
                this.items = [];
            }
            enqueue(element) {
                this.items.push(element);
            }
            dequeue() {
                if (this.isEmpty()) return undefined;
                return this.items.shift(); // FIFO implementation (Alis sa unahan)
            }
            peek() {
                if (this.isEmpty()) return undefined;
                return this.items;
            }
            isEmpty() {
                return this.items.length === 0;
            }
            clear() {
                this.items = [];
            }
        }

        const queueObj = new Queue();

        // Nagpapakita ng Front at Rear labels base sa hiningi ng activity rules
        function renderQueueUI() {
            $('#queue').empty();
            queueObj.items.forEach((item, index) => {
                let tag = "";
                if(index === 0 && queueObj.items.length === 1) tag = '<span class="indicator text-warning">[Front & Rear]</span>';
                else if(index === 0) tag = '<span class="indicator text-danger">[Front]</span>';
                else if(index === queueObj.items.length - 1) tag = '<span class="indicator text-success">[Rear]</span>';
                
                $('#queue').append(`<div id="Q_item_${index}" class="enqueue bg-success text-center text-white p-3 rounded border border-light shadow-sm" style="min-width: 80px;">${tag}${item}</div>`);
            });
        }

        $(document).ready(function() {
            // 1. ENQUEUE OPERATION
            $('#btn_enqueue').on('click', function() {
                let val = $('#QU_data').val().trim();
                if(val === "") return alert("Error: Input box cannot be blank!"); // Requirement 7: Validation sa walang input
                
                queueObj.enqueue(val);
                renderQueueUI();
                $('#QU_data').val('');
            });

            // 2. DEQUEUE OPERATION
            $('#btn_dequeue').on('click', function() {
                if(queueObj.isEmpty()) return alert("Error: Queue Underflow! Nothing to dequeue."); // Requirement 7: Validation sa empty dequeue
                
                let dequeuedVal = queueObj.dequeue();
                renderQueueUI();
                
                let deletedBlock = `<div class="row dequeue bg-secondary text-center text-white p-2 gap-1 mx-2 my-1 rounded border border-light shadow-sm">${dequeuedVal}</div>`;
                $('#dequeue').prepend(deletedBlock);
            });

            // 3. PEEK OPERATION
            $('#btn_pick').on('click', function() {
                if(queueObj.isEmpty()) return alert("Error: Queue is Empty! Nothing to inspect."); // Requirement 7: Validation sa empty peek
                
                let targetElement = $('#Q_item_0'); // Palaging kumukuha sa unahan o Front element
                targetElement.removeClass('bg-success').addClass('pick');
                
                setTimeout(function() {
                    targetElement.removeClass('pick').addClass('bg-success');
                }, 500);
            });

            // 4. CLEAR OPERATION
            $('#btn_clear').on('click', function() {
                queueObj.clear();
                $('#queue').empty();
                $('#dequeue').empty();
                $('#QU_data').val('');
            });
        });
    </script>
</body>
</html>
