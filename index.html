<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Data Structure Simulator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="stack.js" defer></script>
</head>
<body class="bg-light">

    <div class="container-fluid p-4">
        <h2 class="text-center mb-4">Stack Data Structure Simulator</h2>

        <div class="row justify-content-center mb-4">
            <div class="col-sm-6 text-center">
                <div class="mb-3">
                    <label for="stackInput" class="form-label">Enter value</label>
                    <input type="text" id="stackInput" class="form-control text-center">
                </div>

                <div class="d-flex gap-2 justify-content-center flex-wrap">
                    <button id="pushBtn" class="btn btn-success">Push</button>
                    <button id="popBtn" class="btn btn-danger">Pop</button>
                    <button id="peekBtn" class="btn btn-warning">Peek</button>
                    <button id="clearBtn" class="btn btn-secondary">Clear</button>
                </div>
            </div>
        </div>

        <div class="row justify-content-center mx-2">
            <div class="col-sm-4 border bg-white p-3 rounded me-2 mb-3">
                <h5 class="text-center text-primary">Stack Data</h5>
                <hr>
                <div id="stack" class="d-flex flex-column gap-1"></div>
            </div>

            <div class="col-sm-4 border bg-white p-3 rounded mb-3">
                <h5 class="text-center text-danger">Deleted from Stack</h5>
                <hr>
                <div id="deleted" class="d-flex flex-column gap-1"></div>
            </div>
        </div>
    </div>

</body>
</html>
