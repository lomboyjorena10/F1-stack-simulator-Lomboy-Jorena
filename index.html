<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA Stack Data Structure Simulator</title>
    <!-- Official Framework CDN Integration -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <script src="https://jquery.com"></script>
    <style>
        .push { font-weight: bold; }
        .pop { font-weight: bold; }
        .pick { background-color: gold !important; color: black !important; }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid p-4">
        <h2 class="text-center mb-4">Stack Data Structure Simulator</h2>
        
        <!-- Controls interface -->
        <div class="row justify-content-center mb-4">
            <div class="col-sm-6 text-center">
                <div class="mb-3">
                    <label class="form-label font-size-4">Enter value</label>
                    <input type="text" id="ST_data" class="form-control text-center">
                </div>
                <div class="d-flex gap-1 justify-content-center">
                    <button id="btn_push" class="btn btn-success">Push</button>
                    <button id="btn_pop" class="btn btn-danger">Pop</button>
                    <button id="btn_pick" class="btn btn-warning">Pick</button>
                    <button id="btn_clear" class="btn btn-light border">Clear</button>
                </div>
            </div>
        </div>

        <!-- Structural Data View Blocks -->
        <div class="row justify-content-center mx-2">
            <div class="col-sm-4 border bg-white p-3 rounded me-2">
                <h5 class="text-center text-primary">Stack Data</h5>
                <hr>
                <div id="stock" class="d-flex flex-column gap-1"></div>
            </div>
            <div class="col-sm-4 border bg-white p-3 rounded">
                <h5 class="text-center text-danger">Deleted from Stack</h5>
                <hr>
                <div id="pop" class="d-flex flex-column gap-1"></div>
            </div>
        </div>
    </div>

    <script>
        // Integrated Object-Oriented Blueprint Data Architecture
        class Stock {
            constructor() {
                this.items = {};
                this.count = 0;
            }
            push(element) {
                this.items[this.count] = element;
                this.count++;
                return element;
            }
            pop() {
                if (this.count === 0) return undefined;
                this.count--;
                let result = this.items[this.count];
                delete this.items[this.count];
                return result;
            }
            pick() {
                if (this.count === 0) return undefined;
                return this.items[this.count - 1];
            }
            clear() {
                this.items = {};
                this.count = 0;
                return this.items;
            }
        }

        const stockObj = new Stock();

        $(document).ready(function() {
            // 1. PUSH OPERATION
            $('#btn_push').on('click', function() {
                let val = $('#ST_data').val().trim();
                if(val === "") return; 
                
                stockObj.push(val);
                
                let block = `<div id="ST${val}" class="row push bg-danger text-center text-white p-3 gap-1 mx-2 my-1 rounded border border-light shadow-sm">${val}</div>`;
                $('#stock').prepend(block);
                $('#ST_data').val('');
            });

            // 2. POP OPERATION
            $('#btn_pop').on('click', function() {
                let poppedVal = stockObj.pop();
                if(poppedVal === undefined) return;
                
                $(`#ST${poppedVal}`).first().remove();
                
                let deletedBlock = `<div class="row pop bg-secondary text-center text-white p-2 gap-1 mx-2 my-1 rounded border border-light shadow-sm">${poppedVal}</div>`;
                $('#pop').prepend(deletedBlock);
            });

            // 3. PICK/PEEK OPERATION
            $('#btn_pick').on('click', function() {
                let topVal = stockObj.pick();
                if(topVal === undefined) return;
                
                let targetElement = $(`#ST${topVal}`).first();
                targetElement.removeClass('bg-danger').addClass('pick');
                
                setTimeout(function() {
                    targetElement.removeClass('pick').addClass('bg-danger');
                }, 500);
            });

            // 4. SYSTEM RESET AND CLEARANCE
            $('#btn_clear').on('click', function() {
                stockObj.clear();
                $('#stock').empty();
                $('#pop').empty();
                $('#ST_data').val('');
            });
        });
    </script>
</body>
</html>
